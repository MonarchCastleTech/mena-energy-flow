# MENA Energy Flow Tracker Configuration
project:
  id: mena-energy-flow
  name: "MENA Energy Flow Tracker"
  description: "Oil & gas flow monitoring through strategic chokepoints."

openrouter:
  model: "z-ai/glm-5.2:free"
  fallback_model: "google/gemma-4-31b-it:free"

gdelt_query: "oil OR gas OR energy OR pipeline chokepoint OR strait OR shipping"
include_forex: true

sources:
  - name: "GDELT"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
